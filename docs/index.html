<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="theme-color" content="#0e1310">
<title>Uninstall FC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<style>
/*
VOICE: matchday banter between friends, confident and quick
IDEA: a club matchday app: kit lockers, a draw bowl, a league table, a final
PICTURE: kits (jerseys) as every player's face; the shuffle draw is the show
COLOUR+TYPE: night pitch charcoal, turf green action, gold for the final; Outfit
LAYOUT: one phone column, max 560px, bottom-sheet dialogs
*/
:root{--bg:#0e1310;--s1:#171d19;--s2:#1f2722;--s3:#29332c;--line:#2e3932;--ink:#eef4ef;--mut:#8f9d93;--acc:#5fdc84;--acc2:#3fbf66;--accink:#06200f;--gold:#f4c64e;--red:#ff6d6d;--r:16px;color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Outfit,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
body{min-height:100vh;min-height:100dvh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 32px)}
.top{display:flex;align-items:center;gap:10px;min-height:48px;margin-bottom:8px}
.top h1{font-size:20px;font-weight:700;margin:0;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex:none}
.ib:hover{background:var(--s2)}
.ib svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-size:13px;color:var(--mut);margin:18px 2px 8px;font-weight:500}
.card{background:var(--s1);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.inp{width:100%;height:52px;border-radius:12px;background:var(--s2);border:1px solid var(--line);padding:0 14px;font-size:16px}
.inp::placeholder{color:#66736a}
.inp:focus{border-color:var(--acc);outline:none}
.btn{height:54px;border-radius:14px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:16px;background:var(--s2);border:1px solid var(--line)}
.btn.pri{background:var(--acc);color:var(--accink);border:0;box-shadow:0 8px 24px -10px rgba(95,220,132,.6)}
.btn.pri:active{background:var(--acc2)}
.btn.gold{background:var(--gold);color:#2a1e00;border:0}
.btn.sm{height:44px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.mut{color:var(--mut)}.small{font-size:13px}
.err{color:var(--red);font-size:14px;margin-top:8px;min-height:20px}
/* home */
.hero{position:relative;border-radius:24px;overflow:hidden;background:radial-gradient(120% 90% at 50% 0%,#1f5a33 0%,#123320 45%,#0c1a12 100%);padding:28px 20px 22px;margin-top:4px;text-align:center;isolation:isolate}
.hero .pitch{position:absolute;inset:0;z-index:-1;opacity:.2}
.hero h2{font-size:clamp(34px,10vw,48px);line-height:1;margin:12px 0 6px;font-weight:800;letter-spacing:-.02em}
.hero h2 span{color:var(--acc)}
.hero p{margin:0 auto;max-width:30ch;color:#c4d6ca}
.crest{width:96px;height:96px;margin:0 auto;filter:drop-shadow(0 10px 18px rgba(0,0,0,.45))}
.ubar{height:8px;border-radius:8px;background:rgba(255,255,255,.12);overflow:hidden;max-width:220px;margin:16px auto 4px}
.ubar i{display:block;height:100%;width:0;background:var(--acc);border-radius:8px;animation:fill 2.4s ease-in-out infinite alternate}
@keyframes fill{to{width:100%}}
.ulbl{font-size:12px;color:#a8c3b0}
.joinrow{display:flex;gap:10px}
.joinrow .inp{text-transform:uppercase;letter-spacing:.18em;font-weight:700;text-align:center;font-size:20px}
.joinrow .btn{width:auto;padding:0 22px;flex:none}
.rec{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--s1);border:1px solid var(--line);margin-bottom:8px;width:100%;text-align:left}
.rec b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec .code{font-weight:700;letter-spacing:.12em;font-size:13px;color:var(--acc)}
.rec .ball{width:40px;height:40px;border-radius:12px;background:var(--s2);display:grid;place-items:center;flex:none}
/* tournament */
.codechip{display:inline-flex;align-items:center;gap:6px;background:var(--s2);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-weight:700;letter-spacing:.14em;font-size:14px}
.dot{width:8px;height:8px;border-radius:50%;background:#6b766e;flex:none}
.dot.live{background:var(--acc);box-shadow:0 0 0 4px rgba(95,220,132,.18)}
.dot.conn{background:var(--gold)}.dot.off{background:var(--red)}
.sub{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:-2px 0 14px;font-size:13px;color:var(--mut)}
.tabs{display:flex;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin-bottom:14px;position:sticky;top:6px;z-index:5;backdrop-filter:blur(10px)}
.tabs button{flex:1;height:40px;border-radius:10px;font-weight:600;font-size:14px;color:var(--mut)}
.tabs button.on{background:var(--acc);color:var(--accink)}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut);margin-bottom:14px}
.prog .bar{flex:1;height:8px;border-radius:8px;background:var(--s2);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--acc);border-radius:8px;transition:width .5s}
.sharecard{text-align:center;background:linear-gradient(160deg,#173a24,#121a15 70%);border-color:#23462f}
.bigcode{font-size:clamp(36px,12vw,52px);font-weight:800;letter-spacing:.16em;margin:2px 0 4px;padding-left:.16em}
.plist{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--s1);border:1px solid var(--line);border-radius:14px}
.pl .nm{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--s3);color:var(--mut)}
.tag.g{background:rgba(95,220,132,.15);color:var(--acc)}.tag.y{background:rgba(244,198,78,.15);color:var(--gold)}
.kit{flex:none;display:block}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;background:var(--s2);border:1px solid var(--line);font-size:22px;font-weight:600}
.stepper output{min-width:44px;text-align:center;font-size:24px;font-weight:700}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.setrow:last-child{border:0;padding-bottom:0}.setrow:first-child{padding-top:0}
.seg{display:flex;background:var(--s2);border-radius:12px;padding:3px}
.seg button{height:38px;padding:0 12px;border-radius:9px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--s3);color:var(--ink)}
.md{font-size:13px;font-weight:600;color:var(--mut);margin:16px 2px 8px;display:flex;justify-content:space-between}
.mt{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:8px;padding:12px;background:var(--s1);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;width:100%;text-align:left}
.mt.can:hover{border-color:#3d4b41}
.mt .side{display:flex;align-items:center;gap:8px;font-weight:600;font-size:15px}
.mt .side span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt .side.r{flex-direction:row-reverse;text-align:right}
.mt .side.w span{color:var(--ink)}.mt .side.l span{color:var(--mut)}
.score{min-width:64px;text-align:center;font-weight:800;font-size:18px;background:var(--s2);border-radius:10px;padding:6px 8px;font-variant-numeric:tabular-nums;white-space:nowrap}
.score.vs{font-size:13px;color:var(--mut);font-weight:600}
table.tb{width:100%;border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:14px}
.tb th{font-size:12px;color:var(--mut);font-weight:600;text-align:right;padding:8px 6px}
.tb td{padding:10px 6px;text-align:right;border-top:1px solid var(--line)}
.tb th:nth-child(2),.tb td:nth-child(2){text-align:left;width:100%}
.tb td:first-child,.tb th:first-child{text-align:center;width:28px;color:var(--mut)}
.tb .pn{display:flex;align-items:center;gap:8px;font-weight:600}
.tb .pn span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:38vw}
.tb tr.q td{background:rgba(95,220,132,.07)}
.tb tr.q td:first-child{color:var(--acc);font-weight:800;box-shadow:inset 3px 0 0 var(--acc)}
.tb .pts{font-weight:800}
@media(max-width:400px){.tb .hx{display:none}}
.final{text-align:center;background:radial-gradient(100% 80% at 50% 0%,#3b3212,#171a14 70%);border-color:#4a3f17;padding:22px 16px}
.fvs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:10px;margin:18px 0}
.fvs .fp{display:flex;flex-direction:column;align-items:center;gap:8px;font-weight:700}
.fvs .fp span{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fvs .score{font-size:26px;background:rgba(0,0,0,.3)}
.champ{text-align:center;padding:26px 16px;border-radius:24px;background:radial-gradient(90% 70% at 50% 10%,#5a4a12,#1b1a10 75%);border:1px solid #6a5718;margin-bottom:14px;position:relative;overflow:hidden}
.champ .kit{margin:0 auto}
.champ h3{margin:8px 0 0;font-size:30px;font-weight:800}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:560px;max-height:92vh;overflow:auto;background:var(--s1);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 20px);animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:5px;border-radius:5px;background:var(--s3);margin:0 auto 10px}
.sheet h3{margin:0 0 12px;font-size:20px;text-align:center}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}
.kits{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.kits button{aspect-ratio:1;border-radius:12px;background:var(--s2);border:2px solid transparent;display:grid;place-items:center;padding:4px}
.kits button.on{border-color:var(--acc);background:#1d3324}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.sw button{width:32px;height:32px;border-radius:50%;border:2px solid rgba(255,255,255,.15)}
.sw button.on{outline:3px solid var(--acc);outline-offset:2px}
.pats{display:flex;gap:6px;flex-wrap:wrap}
.pats button{height:36px;padding:0 12px;border-radius:10px;background:var(--s2);font-size:13px;font-weight:600;color:var(--mut)}
.pats button.on{background:var(--s3);color:var(--ink)}
.preview{display:flex;justify-content:center;margin:4px 0 6px}
.sc2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;margin:8px 0 16px}
.sc2 .col{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--s2);border-radius:16px;padding:14px 8px}
.sc2 .col b{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sc2 output{font-size:44px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.pens{display:flex;gap:8px;margin-bottom:14px}
.pens button{flex:1;height:44px;border-radius:12px;background:var(--s2);border:2px solid transparent;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px}
.pens button.on{border-color:var(--gold);color:var(--gold)}
.menu button{display:flex;align-items:center;gap:12px;width:100%;height:52px;padding:0 6px;border-radius:12px;font-weight:500;text-align:left}
.menu button:hover{background:var(--s2)}
.menu button.dan{color:var(--red)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);background:#e9f2ec;color:#0e1310;padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;z-index:90;animation:up .2s;max-width:90vw}
/* draw overlay */
.dov{position:fixed;inset:0;z-index:60;background:radial-gradient(100% 70% at 50% 30%,#163824,#070b08 80%);display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 28px) 16px calc(env(safe-area-inset-bottom) + 20px);animation:fade .3s}
.dov h2{margin:0;font-size:26px;font-weight:800;text-align:center}
.dov .hint{color:#9fbaa8;font-size:14px;margin:4px 0 0;text-align:center}
.stage{position:relative;width:min(92vw,520px);height:min(46vh,360px);margin:18px 0;flex:none}
.tile{position:absolute;left:50%;top:50%;width:84px;margin:-42px 0 0 -42px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;font-weight:600;transition:transform .42s cubic-bezier(.5,0,.3,1.4),opacity .4s}
.tile span{max-width:84px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:rgba(0,0,0,.45);padding:2px 8px;border-radius:8px}
.dlist{width:min(92vw,520px);flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
.dlist .mt{opacity:0;transform:translateY(12px) scale(.96);transition:all .35s cubic-bezier(.2,.8,.2,1);margin:0;background:rgba(23,29,25,.9)}
.dlist .mt.in{opacity:1;transform:none}
.dov .btn{max-width:520px;margin-top:12px;flex:none}
canvas.conf{position:fixed;inset:0;pointer-events:none;z-index:80}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
{
/* ---------- config ---------- */
const SYNC_BASE = (()=>{try{return localStorage.getItem('ufc_sync')||'https://ntfy.sh'}catch(e){return 'https://ntfy.sh'}})();
const TOPIC = c => 'uninstallfc_v1_' + c.toLowerCase();
const MAX_PLAYERS = 24, MAX_K = 12;

/* ---------- utils ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const rnd = n => Math.floor(Math.random() * n);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const uid = () => Math.random().toString(36).slice(2, 8);
const hash = s => { let h1 = 0xdeadbeef, h2 = 0x41c6ce57; for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); } h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909); h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909); return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36); };
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
function toast(msg){ document.querySelectorAll('.toast').forEach(t => t.remove()); const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }
function copyText(txt){
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try{ document.execCommand('copy'); }catch(e){} ta.remove(); };
  try{ if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).catch(fallback); else fallback(); }catch(e){ fallback(); }
  toast('Copied');
}
const ICON = {
  back:'<svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
  more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 012-2h10"/></svg>',
  share:'<svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  shuffle:'<svg viewBox="0 0 24 24"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>',
  lock:'<svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>',
  x:'<svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>',
  edit:'<svg viewBox="0 0 24 24"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>',
  undo:'<svg viewBox="0 0 24 24"><path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-15-6.7L3 13"/></svg>',
  out:'<svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/></svg>',
  trophy:'<svg viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 01-10 0zM17 5h3v2a3 3 0 01-3 3M7 5H4v2a3 3 0 003 3"/></svg>'
};
const BALL = s => `<svg width="${s}" height="${s}" viewBox="0 0 40 40"><circle cx="20" cy="20" r="18" fill="#f4f7f5"/><path d="M20 12l7 5-2.7 8h-8.6L13 17z" fill="#121714"/><path d="M20 2v10M27 17l9-4M24.3 25l5 8M15.7 25l-5 8M13 17l-9-4" stroke="#121714" stroke-width="1.6"/><circle cx="20" cy="20" r="18" fill="none" stroke="#c9d3cc"/></svg>`;
const CREST = `<svg class="crest" viewBox="0 0 120 120"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ef097"/><stop offset="1" stop-color="#2ea657"/></linearGradient></defs><path d="M60 6l44 14v34c0 30-19 50-44 60C35 104 16 84 16 54V20z" fill="url(#cg)"/><path d="M60 14l36 11.5V54c0 25-15.5 42-36 51-20.5-9-36-26-36-51V25.5z" fill="#0f2618"/><g transform="translate(40 26)">${BALL(40).replace('<svg width="40" height="40" viewBox="0 0 40 40">','').replace('</svg>','')}</g><rect x="34" y="76" width="52" height="9" rx="4.5" fill="#1f3d29"/><rect x="34" y="76" width="34" height="9" rx="4.5" fill="#6ef097"/><text x="60" y="99" text-anchor="middle" font-family="Outfit,sans-serif" font-weight="800" font-size="11" fill="#6ef097" letter-spacing="2">FC</text></svg>`;

/* ---------- kits ---------- */

/* ---------- sync (ntfy.sh pub/sub, public) ---------- */
async function encode(obj){
  const json = JSON.stringify(obj);
  if (typeof CompressionStream === 'undefined') return 'j1:' + json;
  try{
    const cs = new Blob([json]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    const buf = new Uint8Array(await new Response(cs).arrayBuffer());
    let bin = ''; for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
    return 'z1:' + btoa(bin);
  }catch(e){ return 'j1:' + json; }
}
async function decode(msg){
  try{
    if (msg.startsWith('j1:')) return JSON.parse(msg.slice(3));
    if (msg.startsWith('z1:')){
      const bin = atob(msg.slice(3)); const u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
      const ds = new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return JSON.parse(await new Response(ds).text());
    }
  }catch(e){}
  return null;
}
const newer = (a, b) => !b || a.v > b.v || (a.v === b.v && a.ts > b.ts);
const Sync = {
  async latest(code){
    const res = await fetch(`${SYNC_BASE}/${TOPIC(code)}/json?poll=1&since=all`, {cache:'no-store'});
    if (!res.ok) throw new Error('sync ' + res.status);
    const lines = (await res.text()).split('\n').filter(Boolean);
    let best = null, time = 0;
    for (const l of lines){
      let ev; try{ ev = JSON.parse(l); }catch(e){ continue; }
      if (ev.event !== 'message' || !ev.message) continue;
      const st = await decode(ev.message);
      if (st && st.id === code.toUpperCase() && newer(st, best)) best = st;
      if (st) time = Math.max(time, ev.time || 0);
    }
    return {state: best, time};
  },
  async publish(state){
    const body = await encode(state);
    const res = await fetch(`${SYNC_BASE}/${TOPIC(state.id)}`, {method:'POST', body});
    if (!res.ok) throw new Error('publish ' + res.status);
  },
  es: null, pollT: null,
  subscribe(code, onState, onStatus){
    this.stop();
    onStatus('conn');
    try{
      const es = new EventSource(`${SYNC_BASE}/${TOPIC(code)}/sse`);
      this.es = es;
      es.onopen = () => onStatus('live');
      es.onerror = () => onStatus(es.readyState === 2 ? 'off' : 'conn');
      es.onmessage = async e => {
        let ev; try{ ev = JSON.parse(e.data); }catch(x){ return; }
        if (ev.event && ev.event !== 'message') return;
        if (!ev.message) return;
        const st = await decode(ev.message);
        if (st && st.id === code.toUpperCase()) onState(st);
      };
    }catch(e){ onStatus('off'); }
    // safety net: poll every 20s in case the stream is blocked by a network
    this.pollT = setInterval(async () => {
      try{ const r = await this.latest(code); if (r.state) onState(r.state); if (!this.es || this.es.readyState !== 1) onStatus('live'); }
      catch(e){ if (!this.es || this.es.readyState !== 1) onStatus('off'); }
    }, 20000);
  },
  stop(){ if (this.es) this.es.close(); this.es = null; clearInterval(this.pollT); }
};

/* ---------- tournament logic ---------- */
function validK(n, k){
  if (n < 2) return 'Add at least 2 players';
  if (k < 1) return 'Pick at least 1 match per player';
  if (n % 2 === 1 && k % 2 === 1) return `With ${n} players (odd), matches per player must be even`;
  return '';
}
function makeFixtures(players, k){
  const ids = shuffle(players.map(p => p.i)); const n = ids.length;
  let edges = [];
  if (n % 2 === 0){
    // circle method: each round everybody plays once; cycle rounds, flip home/away on repeats
    const arr = ids.slice(), base = [];
    for (let r = 0; r < n - 1; r++){
      const rd = [];
      for (let i = 0; i < n / 2; i++){ const a = arr[i], b = arr[n - 1 - i]; rd.push(r % 2 ? [b, a] : [a, b]); }
      base.push(rd); arr.splice(1, 0, arr.pop());
    }
    const order = shuffle(base.map((_, i) => i));
    const rounds = [];
    for (let r = 0; r < k; r++){ const cyc = Math.floor(r / (n - 1)); const rd = base[order[r % (n - 1)]].map(([a, b]) => cyc % 2 ? [b, a] : [a, b]); rounds.push(shuffle(rd)); }
    let mi = 0;
    return rounds.flatMap((rd, r) => rd.map(([a, b]) => ({i: 'm' + (mi++), r: r + 1, a, b, sa: null, sb: null})));
  }
  // odd n, even k: circulant graph, offsets 1..(n-1)/2 cycled
  const maxOff = (n - 1) / 2;
  for (let j = 0; j < k / 2; j++){
    const d = (j % maxOff) + 1, flip = Math.floor(j / maxOff) % 2;
    for (let i = 0; i < n; i++){ const a = ids[i], b = ids[(i + d) % n]; edges.push(flip ? [b, a] : [a, b]); }
  }
  edges = shuffle(edges);
  const out = []; let r = 0, mi = 0;
  const load = {}; ids.forEach(x => load[x] = 0);
  while (edges.length){
    r++; const used = new Set(); const rest = [];
    edges.sort((x, y) => (load[y[0]] + load[y[1]]) - (load[x[0]] + load[x[1]]));
    for (const e of edges){
      if (used.has(e[0]) || used.has(e[1])) { rest.push(e); continue; }
      used.add(e[0]); used.add(e[1]); load[e[0]]--; load[e[1]]--;
      out.push({i: 'm' + (mi++), r, a: e[0], b: e[1], sa: null, sb: null});
    }
    edges = rest;
  }
  return out;
}
const played = m => m.sa != null && m.sb != null;
function standings(st){
  const rows = {};
  st.p.forEach(p => rows[p.i] = {p, P:0, W:0, D:0, L:0, GF:0, GA:0, Pts:0});
  st.m.filter(played).forEach(m => {
    const A = rows[m.a], B = rows[m.b]; if (!A || !B) return;
    A.P++; B.P++; A.GF += m.sa; A.GA += m.sb; B.GF += m.sb; B.GA += m.sa;
    if (m.sa > m.sb){ A.W++; B.L++; A.Pts += 3; } else if (m.sa < m.sb){ B.W++; A.L++; B.Pts += 3; } else { A.D++; B.D++; A.Pts++; B.Pts++; }
  });
  return Object.values(rows).sort((x, y) => y.Pts - x.Pts || (y.GF - y.GA) - (x.GF - x.GA) || y.GF - x.GF || y.W - x.W || x.p.n.localeCompare(y.p.n));
}
const leagueDone = st => st.m.length > 0 && st.m.every(played);
function finalists(st){ if (st.f && st.f.a) return [st.f.a, st.f.b]; const s = standings(st); return s.length >= 2 ? [s[0].p.i, s[1].p.i] : [null, null]; }
function champion(st){ const f = st.f; if (!f || f.sa == null) return null; if (f.sa > f.sb) return f.a; if (f.sb > f.sa) return f.b; return f.pw || null; }
function phase(st){ if (!st.m.length) return 'lobby'; if (!leagueDone(st)) return 'league'; return champion(st) ? 'done' : 'final'; }

const S = { view:'home', code:null, st:null, status:'off', dirty:false, tab:null, err:'', pending:null };
const isHost = () => S.code && LS.get('ufc_host_' + S.code, false);
const canScore = () => isHost() || (S.st && S.st.edit === 'all');
const mine = () => LS.get('ufc_mine_' + S.code, []);
const P = id => S.st.p.find(p => p.i === id) || {n:'?', k:PRESETS[0]};
function remember(st){
  const rec = LS.get('ufc_recent', []).filter(r => r.c !== st.id);
  rec.unshift({c: st.id, n: st.n, t: Date.now()}); LS.set('ufc_recent', rec.slice(0, 8));
}
function setState(st, {local = false} = {}){
  const prev = S.st;
  S.st = st; LS.set('ufc_t_' + st.id, st); remember(st);
  if (local){ S.dirty = true; flush(); }
  // draw animation for everybody who is watching when fixtures get drawn
  if (st.dr && (!prev || prev.dr !== st.dr) && LS.get('ufc_seen_' + st.id) !== st.dr && Date.now() - st.dr < 90000){
    LS.set('ufc_seen_' + st.id, st.dr); S.tab = 'fx'; render(); playDraw(st); return;
  }
  const c = champion(st);
  if (c && prev && !champion(prev)) { S.tab = 'fin'; render(); confetti(); return; }
  render();
}
function commit(mut){
  if (!S.st) return;
  const st = JSON.parse(JSON.stringify(S.st));
  mut(st); st.v = (S.st.v || 0) + 1; st.ts = Date.now();
  setState(st, {local: true});
}
async function flush(){
  if (!S.dirty || !S.st || S.pending) return;
  const st = S.st;
  S.pending = Sync.publish(st).then(() => { if (S.st === st) S.dirty = false; }).catch(() => { S.status = 'off'; paintStatus(); }).finally(() => { S.pending = null; });
}
setInterval(() => { if (S.dirty) flush(); }, 8000);

async function openTournament(code){
  code = code.toUpperCase();
  S.code = code; S.view = 't'; S.err = ''; S.tab = null;
  const local = LS.get('ufc_t_' + code, null);
  S.st = local; S.status = 'conn';
  if (location.hash !== '#t-' + code) history.pushState(null, '', '#t-' + code);
  render();
  try{
    const r = await Sync.latest(code);
    if (r.state && newer(r.state, S.st)) setState(r.state);
    else if (S.st && (!r.state || newer(S.st, r.state))){ S.dirty = true; flush(); } // server lost it or is behind: restore
    else if (S.st && r.time && Date.now() / 1000 - r.time > 6 * 3600){ Sync.publish(S.st).catch(() => {}); } // keep it in the 12h cache
    S.status = 'live';
  }catch(e){ S.status = 'off'; }
  if (!S.st){ S.view = 'join'; S.err = S.status === 'off' ? "Couldn't reach the sync server. Check your internet." : `No tournament found with code ${code}`; render(); return; }
  Sync.subscribe(code, st => { if (S.code === code && newer(st, S.st)) setState(st); }, s => { S.status = s; paintStatus(); });
  render();
}

  st.m.forEach(m => (rounds[m.r] = rounds[m.r] || []).push(m));
  return Object.keys(rounds).sort((a, b) => a - b).map(r => {
    const ms = rounds[r], d = ms.filter(played).length;
    return `<div class="md"><span>Matchday ${r}</span><span>${d}/${ms.length}</span></div>${ms.map(m => matchRow(m)).join('')}`;
  }).join('') + (canScore() ? '<p class="small mut" style="text-align:center">Tap a match to enter the score</p>' : '<p class="small mut" style="text-align:center">Only the host can enter scores</p>');
}
function pTable(){
  const s = standings(S.st);
  return `<div class="card" style="padding:6px 8px"><table class="tb"><thead><tr><th>#</th><th>Player</th><th>P</th><th class="hx">W</th><th class="hx">D</th><th class="hx">L</th><th>GD</th><th>Pts</th></tr></thead><tbody>
  ${s.map((r, i) => { const gd = r.GF - r.GA; return `<tr class="${i < 2 ? 'q' : ''}"><td>${i + 1}</td><td><div class="pn">${kitSVG(r.p.k, 24)}<span>${esc(r.p.n)}</span></div></td><td>${r.P}</td><td class="hx">${r.W}</td><td class="hx">${r.D}</td><td class="hx">${r.L}</td><td>${gd > 0 ? '+' : ''}${gd}</td><td class="pts">${r.Pts}</td></tr>`; }).join('')}
  </tbody></table></div><p class="small mut" style="margin:10px 4px"><span class="tag g">Top 2</span> go through to the final.</p>`;
}
function pFinal(){
  const st = S.st, ph = phase(st), [a, b] = finalists(st), c = champion(st);
  const A = a ? P(a) : null, B = b ? P(b) : null, f = st.f || {};
  const left = st.m.filter(m => !played(m)).length;
  const scored = f.sa != null;
  return `
  ${c ? `<div class="champ">${kitSVG(P(c).k, 88)}<div class="small" style="color:var(--gold);font-weight:700;margin-top:6px">CHAMPION</div><h3>${esc(P(c).n)}</h3><p class="mut small" style="margin:6px 0 0">${esc(st.n)}</p></div>` : ''}
  <div class="card final">
    <div style="display:flex;align-items:center;justify-content:center;gap:8px;color:var(--gold);font-weight:700">${ICON.trophy.replace('<svg', '<svg width="20" height="20" style="stroke:currentColor;fill:none;stroke-width:2"')} The Final</div>
    ${A && B ? `<div class="fvs"><div class="fp">${kitSVG(A.k, 64)}<span>${esc(A.n)}</span></div><span class="score ${scored ? '' : 'vs'}">${scored ? `${f.sa} – ${f.sb}` : 'vs'}</span><div class="fp">${kitSVG(B.k, 64)}<span>${esc(B.n)}</span></div></div>` : '<div class="empty">Not enough players yet</div>'}
    ${scored && f.sa === f.sb && f.pw ? `<p class="small" style="margin:-6px 0 10px;color:var(--gold)">${esc(P(f.pw).n)} won on penalties</p>` : ''}
    ${ph === 'league' ? `<p class="mut small" style="margin:0">${left} league match${left === 1 ? '' : 'es'} left. These are the top 2 as it stands.</p>` : ''}
    ${ph !== 'league' && ph !== 'lobby' && canScore() ? `<button class="btn ${scored ? '' : 'gold'}" data-act="score-final">${scored ? 'Edit final score' : 'Enter final score'}</button>` : ''}
    ${ph === 'final' && !canScore() ? '<p class="mut small" style="margin:0">Waiting for the host to enter the final score…</p>' : ''}
  </div>`;
}
function pPlayers(){
  const s = standings(S.st);
  return `<div class="plist">${S.st.p.map(p => { const r = s.find(x => x.p.i === p.i); return playerRow(p, `<span class="small mut">${r.P} played · ${r.Pts} pts</span>`); }).join('')}</div>`;
}

/* ---------- sheets ---------- */
function sheet(html, mount){
  closeSheet();
  const s = document.createElement('div'); s.className = 'scrim'; s.id = 'scrim';
  s.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div>`;
  s.addEventListener('click', e => { if (e.target === s) closeSheet(); });
  document.body.appendChild(s); mount && mount(s);
}
function closeSheet(){ const s = $('#scrim'); if (s) s.remove(); }
function kitPicker(kit, title, onDone, {name = null, del = false} = {}){
  let k = kit.slice();
  const draw = s => {
    s.querySelector('.preview').innerHTML = kitSVG(k, 84);
    s.querySelector('.kits').innerHTML = PRESETS.map((p, i) => `<button class="${p.join() === k.join() ? 'on' : ''}" data-i="${i}" aria-label="Kit ${i + 1}">${kitSVG(p, 40)}</button>`).join('');
    s.querySelector('#pats').innerHTML = PATS.map(p => `<button class="${k[2] === p ? 'on' : ''}" data-p="${p}">${p[0].toUpperCase() + p.slice(1)}</button>`).join('');
    s.querySelector('#c1').innerHTML = COLORS.map(c => `<button class="${k[0] === c ? 'on' : ''}" style="background:${c}" data-c="${c}" aria-label="Main colour ${c}"></button>`).join('');
    s.querySelector('#c2').innerHTML = COLORS.map(c => `<button class="${k[1] === c ? 'on' : ''}" style="background:${c}" data-c="${c}" aria-label="Second colour ${c}"></button>`).join('');
  };
  sheet(`<h3>${esc(title)}</h3>
    ${name !== null ? `<input class="inp" id="pname" maxlength="18" placeholder="Player name" value="${esc(name)}" style="margin-bottom:8px">` : ''}
    <div class="preview"></div>
    <div class="lbl" style="margin-top:4px">Presets</div><div class="kits"></div>
    <div class="lbl">Pattern</div><div class="pats" id="pats"></div>
    <div class="lbl">Main colour</div><div class="sw" id="c1"></div>
    <div class="lbl">Second colour</div><div class="sw" id="c2"></div>
    <div class="err" id="perr"></div>
    <button class="btn pri" id="pdone">${name !== null ? 'Save player' : 'Use this kit'}</button>
    ${del ? `<button class="btn" id="pdel" style="margin-top:8px;color:var(--red)">Remove player</button>` : ''}`, s => {
    draw(s);
    s.querySelector('.kits').onclick = e => { const b = e.target.closest('[data-i]'); if (b){ k = PRESETS[+b.dataset.i].slice(); draw(s); } };
    s.querySelector('#pats').onclick = e => { const b = e.target.closest('[data-p]'); if (b){ k[2] = b.dataset.p; draw(s); } };
    s.querySelector('#c1').onclick = e => { const b = e.target.closest('[data-c]'); if (b){ k[0] = b.dataset.c; draw(s); } };
    s.querySelector('#c2').onclick = e => { const b = e.target.closest('[data-c]'); if (b){ k[1] = b.dataset.c; draw(s); } };
    s.querySelector('#pdone').onclick = () => {
      const nm = name !== null ? s.querySelector('#pname').value.trim() : null;
      if (name !== null && !nm){ s.querySelector('#perr').textContent = 'Enter a name'; return; }
      const r = onDone(k, nm); if (r){ s.querySelector('#perr').textContent = r; return; } closeSheet();
    };
    if (del) s.querySelector('#pdel').onclick = () => { onDone(null, null, true); closeSheet(); };
    const pn = s.querySelector('#pname'); if (pn && !name) pn.focus();
  });
}
function scoreSheet(isFinal, m){
  const st = S.st;
  let a, b, sa, sb, pw;
  if (isFinal){ [a, b] = finalists(st); sa = st.f && st.f.sa != null ? st.f.sa : 0; sb = st.f && st.f.sb != null ? st.f.sb : 0; pw = st.f && st.f.pw; }
  else { a = m.a; b = m.b; sa = m.sa ?? 0; sb = m.sb ?? 0; }
  const A = P(a), B = P(b);
  const paint = s => {
    s.querySelector('#oa').textContent = sa; s.querySelector('#ob').textContent = sb;
    const pens = s.querySelector('#pens');
    if (pens){ pens.style.display = sa === sb ? '' : 'none'; pens.querySelectorAll('button').forEach(x => x.classList.toggle('on', x.dataset.w === pw)); }
  };
  sheet(`<h3>${isFinal ? 'Final score' : 'Enter score'}</h3>
    <div class="sc2">
      <div class="col">${kitSVG(A.k, 48)}<b>${esc(A.n)}</b><output id="oa"></output><div class="stepper"><button data-s="a" data-d="-1" aria-label="${esc(A.n)} minus">−</button><button data-s="a" data-d="1" aria-label="${esc(A.n)} plus">+</button></div></div>
      <div class="col">${kitSVG(B.k, 48)}<b>${esc(B.n)}</b><output id="ob"></output><div class="stepper"><button data-s="b" data-d="-1" aria-label="${esc(B.n)} minus">−</button><button data-s="b" data-d="1" aria-label="${esc(B.n)} plus">+</button></div></div>
    </div>
    ${isFinal ? `<div id="pens"><div class="lbl" style="margin-top:0;text-align:center">Level. Who won on penalties?</div><div class="pens"><button data-w="${esc(a)}">${esc(A.n)}</button><button data-w="${esc(b)}">${esc(B.n)}</button></div></div>` : ''}
    <div class="err" id="serr"></div>
    <button class="btn pri" id="ssave">Save result</button>
    ${(isFinal ? st.f && st.f.sa != null : played(m)) ? `<button class="btn" id="sclear" style="margin-top:8px">${ICON.undo} Clear result</button>` : ''}`, s => {
    paint(s);
    s.querySelector('.sc2').onclick = e => { const x = e.target.closest('[data-s]'); if (!x) return; const d = +x.dataset.d; if (x.dataset.s === 'a') sa = Math.max(0, Math.min(99, sa + d)); else sb = Math.max(0, Math.min(99, sb + d)); paint(s); };
    const pens = s.querySelector('#pens'); if (pens) pens.onclick = e => { const x = e.target.closest('[data-w]'); if (x){ pw = x.dataset.w; paint(s); } };
    s.querySelector('#ssave').onclick = () => {
      if (isFinal && sa === sb && !pw){ s.querySelector('#serr').textContent = 'Pick the penalty shoot-out winner'; return; }
      if (isFinal) commit(t => { t.f = {a, b, sa, sb, pw: sa === sb ? pw : null}; });
      else commit(t => { const x = t.m.find(y => y.i === m.i); x.sa = sa; x.sb = sb; });
      closeSheet(); toast('Result saved');
    };
    const cl = s.querySelector('#sclear');
    if (cl) cl.onclick = () => { if (isFinal) commit(t => { t.f = null; }); else commit(t => { const x = t.m.find(y => y.i === m.i); x.sa = null; x.sb = null; }); closeSheet(); };
  });
}
function menuSheet(){
  const st = S.st, host = isHost(), anyScore = st.m.some(played);
  sheet(`<h3>${esc(st.n)}</h3><div class="menu">
    <button data-mi="copy">${ICON.copy} Copy code ${esc(st.id)}</button>
    ${host ? '' : `<button data-mi="unlock">${ICON.lock} I'm the host (enter PIN)</button>`}
    ${host && st.m.length && !anyScore ? `<button data-mi="redraw">${ICON.shuffle} Redraw fixtures</button><button data-mi="lobby">${ICON.undo} Back to lobby</button>` : ''}
    ${host && st.m.length ? `<button data-mi="mode">${ICON.edit} Score entry: ${st.edit === 'all' ? 'Everyone' : 'Host only'} (tap to switch)</button>` : ''}
    ${host && st.f && st.f.sa != null ? `<button data-mi="unfinal">${ICON.undo} Clear final result</button>` : ''}
    <button data-mi="leave" class="dan">${ICON.out} Remove from this device</button>
  </div>`, s => {
    s.querySelector('.menu').onclick = e => {
      const b = e.target.closest('[data-mi]'); if (!b) return; const a = b.dataset.mi;
      if (a === 'copy'){ copyText(st.id); closeSheet(); }
      if (a === 'unlock') pinSheet();
      if (a === 'redraw'){ closeSheet(); doDraw(); }
      if (a === 'lobby'){ commit(t => { t.m = []; t.f = null; t.dr = null; }); closeSheet(); }
      if (a === 'mode'){ commit(t => { t.edit = t.edit === 'all' ? 'host' : 'all'; }); closeSheet(); }
      if (a === 'unfinal'){ commit(t => { t.f = null; }); closeSheet(); }
      if (a === 'leave'){ LS.set('ufc_recent', LS.get('ufc_recent', []).filter(r => r.c !== st.id)); LS.del('ufc_t_' + st.id); LS.del('ufc_host_' + st.id); closeSheet(); go('home'); }
    };
  });
}
function pinSheet(){
  sheet(`<h3>Host PIN</h3><input class="inp" id="pin" inputmode="numeric" maxlength="6" placeholder="PIN" style="text-align:center;font-size:22px;letter-spacing:.3em"><div class="err" id="perr"></div><button class="btn pri" id="pok">Unlock host controls</button>`, s => {
    const i = s.querySelector('#pin'); i.focus();
    s.querySelector('#pok').onclick = () => {
      if (hash(S.st.id + ':' + i.value.trim()) === S.st.h){ LS.set('ufc_host_' + S.st.id, true); closeSheet(); toast('You are now the host'); render(); }
      else s.querySelector('#perr').textContent = 'Wrong PIN';
    };
  });
}

/* ---------- draw animation ---------- */
function doDraw(){
  commit(t => { t.m = makeFixtures(t.p, t.k); t.f = null; t.dr = Date.now(); });
}
async function playDraw(st){
  document.querySelectorAll('.dov').forEach(x => x.remove());
  const ov = document.createElement('div'); ov.className = 'dov';
  ov.innerHTML = `<h2 id="dh">Shuffling players…</h2><p class="hint">${esc(st.n)} · ${st.k} match${st.k === 1 ? '' : 'es'} each</p><div class="stage" id="stage"></div><div class="dlist" id="dlist"></div><button class="btn pri" id="dgo">Skip</button>`;
  document.body.appendChild(ov);
  let skip = false;
  ov.querySelector('#dgo').onclick = () => { skip = true; ov.remove(); };
  const stage = ov.querySelector('#stage');
  const tiles = st.p.map(p => { const t = document.createElement('div'); t.className = 'tile'; t.innerHTML = `${kitSVG(p.k, 56)}<span>${esc(p.n)}</span>`; stage.appendChild(t); return t; });
  const W = stage.clientWidth, H = stage.clientHeight;
  const place = (fn) => tiles.forEach((t, i) => { const [x, y, r] = fn(i); t.style.transform = `translate(${x}px,${y}px) rotate(${r || 0}deg)`; });
  const ring = () => place(i => { const a = i / tiles.length * Math.PI * 2 - Math.PI / 2; return [Math.cos(a) * (W / 2 - 50), Math.sin(a) * (H / 2 - 50), 0]; });
  ring(); await sleep(reduced ? 50 : 500);
  for (let s = 0; s < (reduced ? 0 : 7) && !skip; s++){ place(() => [(Math.random() - .5) * (W - 100), (Math.random() - .5) * (H - 100), (Math.random() - .5) * 40]); await sleep(380); }
  if (skip) return;
  place(() => [0, 0, 0]); tiles.forEach(t => t.style.opacity = '0'); await sleep(reduced ? 0 : 420);
  stage.style.height = '0'; stage.style.margin = '8px 0';
  ov.querySelector('#dh').textContent = 'Fixtures drawn!';
  const list = ov.querySelector('#dlist');
  const gap = Math.max(60, Math.min(260, 4200 / Math.max(1, st.m.length)));
  for (const m of st.m){
    if (skip) return;
    const w = document.createElement('div'); w.innerHTML = matchRow(m).replace('data-act="score"', ''); const el = w.firstElementChild; el.removeAttribute('data-act');
    list.appendChild(el); el.scrollIntoView({block:'nearest'}); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
    if (!reduced) await sleep(gap);
  }
  list.querySelectorAll('.mt').forEach(x => x.classList.add('in'));
  const g = ov.querySelector('#dgo'); g.textContent = "Let's play"; g.classList.remove('pri'); g.classList.add('pri');
}
function confetti(){
  if (reduced) return;
  const c = document.createElement('canvas'); c.className = 'conf'; document.body.appendChild(c);
  const x = c.getContext('2d'); const dpr = devicePixelRatio || 1; c.width = innerWidth * dpr; c.height = innerHeight * dpr; x.scale(dpr, dpr);
  const cols = ['#5fdc84', '#f4c64e', '#f2f4f3', '#2f6fe0', '#e23b3b'];
  const ps = Array.from({length: 140}, () => ({x: innerWidth / 2, y: innerHeight / 3, vx: (Math.random() - .5) * 14, vy: Math.random() * -14 - 4, r: Math.random() * 6 + 3, c: cols[rnd(cols.length)], a: Math.random() * 6}));
  let f = 0;
  const step = () => { x.clearRect(0, 0, innerWidth, innerHeight); ps.forEach(p => { p.vy += .35; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.a += .2; x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); x.restore(); }); if (++f < 180) requestAnimationFrame(step); else c.remove(); };
  step();
}

/* ---------- render + events ---------- */
function render(){
  const app = $('#app');
  const y = scrollY;
  app.innerHTML = S.view === 'home' ? vHome() : S.view === 'create' ? vCreate() : S.view === 'join' ? vJoin() : vT();
  if (S.view === 't') scrollTo(0, y);
}
function go(view, push = true){
  if (view !== 't'){ Sync.stop(); S.code = view === 'join' ? S.code : null; S.st = null; }
  S.view = view; if (view !== 'join' && view !== 'home') S.err = '';
  if (push){ const h = view === 'home' ? '#' : '#' + view; if (location.hash !== h) history.pushState(null, '', h === '#' ? location.pathname + location.search : h); }
  render(); scrollTo(0, 0);
}
function route(){
  const h = location.hash.slice(1);
  if (h.startsWith('t-')){ const c = h.slice(2).toUpperCase(); if (S.code !== c || S.view !== 't') openTournament(c); }
  else if (h === 'create') go('create', false);
  else { S.err = ''; go('home', false); }
}
addEventListener('popstate', () => { closeSheet(); document.querySelectorAll('.dov').forEach(x => x.remove()); route(); });

document.addEventListener('submit', e => {
  if (e.target.id !== 'joinf') return;
  e.preventDefault();
  const c = $('#jcode').value.trim().toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (c.length < 4){ S.err = 'Enter the 6-character code'; render(); return; }
  openTournament(c);
});
document.addEventListener('input', e => {
  if (S.view === 'create' && S.draft){ if (e.target.id === 'cname') S.draft.name = e.target.value; if (e.target.id === 'cme') S.draft.me = e.target.value; if (e.target.id === 'cpin') S.draft.pin = e.target.value.replace(/\D/g, ''); }
});
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, st = S.st;
  if (a === 'home') go('home');
  else if (a === 'go-create'){ S.draft = null; go('create'); }
  else if (a === 'open') openTournament(el.dataset.c);
  else if (a === 'pick-me-kit') kitPicker(S.draft.kit, 'Your kit', k => { S.draft.kit = k; render(); });
  else if (a === 'create'){
    const d = S.draft; const name = d.name.trim() || 'Uninstall FC Cup';
    if (!/^\d{4,6}$/.test(d.pin)){ S.err = 'PIN must be 4 to 6 digits'; render(); return; }
    el.disabled = true; el.textContent = 'Creating…';
    let code = genCode();
    for (let t = 0; t < 4; t++){ try{ const r = await Sync.latest(code); if (!r.state) break; code = genCode(); }catch(x){ break; } }
    const pid = uid();
    const stt = {id: code, n: name, v: 1, ts: Date.now(), h: hash(code + ':' + d.pin), edit: 'all', k: 3, p: d.me.trim() ? [{i: pid, n: d.me.trim().slice(0, 18), k: d.kit}] : [], m: [], f: null, dr: null};
    LS.set('ufc_host_' + code, true); if (d.me.trim()) LS.set('ufc_mine_' + code, [pid]);
    LS.set('ufc_t_' + code, stt); S.dirty = true; S.st = stt; S.code = code;
    await Sync.publish(stt).then(() => S.dirty = false).catch(() => {});
    S.draft = null; openTournament(code);
  }
  else if (a === 'tab'){ S.tab = el.dataset.t; render(); }
  else if (a === 'copy-code') copyText(st.id);
  else if (a === 'share'){
    const text = `Join my Uninstall FC tournament "${st.n}" with code ${st.id}`;
    if (navigator.share) navigator.share({title: 'Uninstall FC', text}).catch(() => {}); else copyText(text);
  }
  else if (a === 'add-p'){
    kitPicker(PRESETS[(st.p.length * 7) % PRESETS.length], 'Add player', (k, nm) => {
      if (S.st.p.some(p => p.n.toLowerCase() === nm.toLowerCase())) return 'That name is already taken';
      const id = uid(); LS.set('ufc_mine_' + S.code, [...mine(), id]);
      commit(t => { t.p.push({i: id, n: nm.slice(0, 18), k}); });
    }, {name: ''});
  }
  else if (a === 'edit-p'){
    const p = P(el.dataset.p);
    kitPicker(p.k, 'Edit player', (k, nm, del) => {
      if (del){ commit(t => { t.p = t.p.filter(x => x.i !== p.i); }); return; }
      if (S.st.p.some(x => x.i !== p.i && x.n.toLowerCase() === nm.toLowerCase())) return 'That name is already taken';
      commit(t => { const x = t.p.find(y => y.i === p.i); x.n = nm.slice(0, 18); x.k = k; });
    }, {name: p.n, del: true});
  }
  else if (a === 'k'){ const k = Math.max(1, Math.min(MAX_K, st.k + +el.dataset.d)); if (k !== st.k) commit(t => { t.k = k; }); }
  else if (a === 'edit-mode'){ if (st.edit !== el.dataset.m) commit(t => { t.edit = el.dataset.m; }); }
  else if (a === 'draw') doDraw();
  else if (a === 'score'){ const m = st.m.find(x => x.i === el.dataset.m); if (m) scoreSheet(false, m); }
  else if (a === 'score-final') scoreSheet(true);
  else if (a === 'menu') menuSheet();
});

route();
}
</script>
